# ランキングの集計（プロトコル v2、2026-10-12）：Worker から新しい記録だけを読み、state/ の表を更新して、GitHub Pages（docs/ranking2.txt・docs/me/NN.txt）を書き出す（15 分ごと）。
# ワールドは Pages の URL を読む（信頼ドメイン）。変化がなければコミットしない。秘密 RANKING_KEY = Worker の EXPORT_KEY
name: export-ranking
on:
  schedule:
    - cron: "7 * * * *"   # 予備（本来の起動は Worker の Cron Trigger が毎時 0・15・30・45 分に workflow_dispatch で行う）
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: export-ranking
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update
        env:
          RANKING_KEY: ${{ secrets.RANKING_KEY }}
        run: node tools/update.mjs
      - name: Commit
        run: |
          git config user.name "ranking-bot"
          git config user.email "ranking-bot@users.noreply.github.com"
          git add docs state
          git diff --cached --quiet || git commit -m "ranking: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
